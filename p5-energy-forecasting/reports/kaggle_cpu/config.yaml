name: household_power
output_dir: /kaggle/working/outputs/household_power
seeds:
- 0
- 1
- 2
models:
- seasonal_naive
- weekly_naive
- ets
- sarima
- lstm
- transformer
data:
  raw_dir: data/raw
  url: https://archive.ics.uci.edu/static/public/235/individual+household+electric+power+consumption.zip
  target: Global_active_power
  freq: h
  max_gap_hours: 6
  val_start: '2009-07-01'
  test_start: '2010-01-01'
  test_end: null
  synthetic: false
backtest:
  horizon: 24
  stride: 24
  season: 24
  max_folds: null
stat:
  window_days: 28
  sarima_order:
  - 2
  - 0
  - 1
  sarima_seasonal:
  - 1
  - 1
  - 1
  - 24
  refit_every: 7
nn:
  lookback: 168
  hidden: 64
  layers: 2
  heads: 4
  dropout: 0.1
  epochs: 30
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  device: auto
anomaly:
  n_events: 40
  kinds:
  - spike
  - dropout
  - level_shift
  z_grid:
  - 2.5
  - 3.0
  - 3.5
  - 4.0
  - 5.0
  - 6.0
  window: 168
  detectors:
  - raw_zscore
  - seasonal_naive
  - weekly_naive
  - lstm
  inject_seed: 123
