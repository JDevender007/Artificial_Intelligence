# MovieLens-1M, global temporal split 80/10/10, 3 seeds, all models + two-tower ablations.
name: ml1m
output_dir: outputs/ml1m
seeds: [0, 1, 2]
models: [popularity, bpr_mf, two_tower, two_tower_nofeat, two_tower_nologq, two_tower_inbatch]
serve_model: two_tower
data:
  min_rating: 4
  val_frac: 0.1
  test_frac: 0.1
train:
  epochs: 40
  batch_size: 1024
  patience: 4
bpr:
  dim: 64
  lr: 5.0e-3
  reg: 1.0e-5
tower:
  dim: 64
  emb: 32
  hidden: 128
  history_len: 30
  temperature: 0.05
  n_random_neg: 256
  logq: true
  use_features: true
  id_dropout: 0.1
  lr: 1.0e-3
eval:
  ks: [10, 20, 50]
  k_main: 20
  n_bootstrap: 1000
  hnsw_m: 32
  hnsw_ef: [16, 32, 64, 128]
