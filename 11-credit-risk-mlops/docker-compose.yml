# API + MLflow UI for local work:  docker compose up --build
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./logs:/app/logs"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
    ports: ["5000:5000"]
    volumes: [".:/mlflow"]
