name: p8-ci
on:
  push:
    branches: [main]
    paths: ["08-guarded-tool-agent/**", ".github/workflows/p8-ci.yml"]
  pull_request:
    paths: ["08-guarded-tool-agent/**", ".github/workflows/p8-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-guarded-tool-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 08-guarded-tool-agent/requirements*.txt
      - run: pip install -r requirements-ci.txt && pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
