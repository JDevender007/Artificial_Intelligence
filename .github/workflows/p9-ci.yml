name: p9-ci
on:
  push:
    branches: [main]
    paths: ["09-domain-lora/**", ".github/workflows/p9-ci.yml"]
  pull_request:
    paths: ["09-domain-lora/**", ".github/workflows/p9-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09-domain-lora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 09-domain-lora/requirements*.txt
      - run: pip install -r requirements-ci.txt && pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
