name: p5-ci
on:
  push:
    branches: [main]
    paths: ["05-load-forecasting/**", ".github/workflows/p5-ci.yml"]
  pull_request:
    paths: ["05-load-forecasting/**", ".github/workflows/p5-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-load-forecasting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 05-load-forecasting/requirements*.txt
      - run: pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-ci.txt && pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
