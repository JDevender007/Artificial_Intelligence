name: p7-ci
on:
  push:
    branches: [main]
    paths: ["p7-rag-qlora/**", ".github/workflows/p7-ci.yml"]
  pull_request:
    paths: ["p7-rag-qlora/**", ".github/workflows/p7-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p7-rag-qlora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: p7-rag-qlora/requirements*.txt
      - run: pip install -r requirements-ci.txt && pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
