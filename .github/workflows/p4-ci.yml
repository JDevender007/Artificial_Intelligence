name: p4-ci
on:
  push:
    branches: [main]
    paths: ["04-intent-classification/**", ".github/workflows/p4-ci.yml"]
  pull_request:
    paths: ["04-intent-classification/**", ".github/workflows/p4-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-intent-classification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 04-intent-classification/requirements*.txt
      - run: pip install -r requirements-ci.txt && pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
