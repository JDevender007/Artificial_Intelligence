name: p10-ci
on:
  push:
    branches: [main]
    paths: ["10-rl-inventory/**", ".github/workflows/p10-ci.yml"]
  pull_request:
    paths: ["10-rl-inventory/**", ".github/workflows/p10-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10-rl-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 10-rl-inventory/requirements*.txt
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
