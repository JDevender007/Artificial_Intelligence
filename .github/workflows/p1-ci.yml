name: p1-ci

on:
  push:
    branches: [main]
    paths: ["p1-credit-default-risk/**", ".github/workflows/p1-ci.yml"]
  pull_request:
    paths: ["p1-credit-default-risk/**", ".github/workflows/p1-ci.yml"]

defaults:
  run:
    working-directory: p1-credit-default-risk

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: p1-credit-default-risk/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Tests (synthetic data, no download)
        run: pytest
