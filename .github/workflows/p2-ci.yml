name: p2-ci

on:
  push:
    branches: [main]
    paths: ["02-dl-fundamentals/**", ".github/workflows/p2-ci.yml"]
  pull_request:
    paths: ["02-dl-fundamentals/**", ".github/workflows/p2-ci.yml"]

defaults:
  run:
    working-directory: 02-dl-fundamentals

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-dl-fundamentals/requirements*.txt
      - name: Install (CPU-only torch keeps CI small and fast)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Tests (FakeData, no download, CPU)
        run: pytest
