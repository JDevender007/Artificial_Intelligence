# Single source of parameters for the DVC pipeline (dvc.yaml) and the monitor.
data:
  raw_dir: data/raw
  processed_dir: data/processed
  test_size: 0.2
  split_seed: 42
train:
  seeds: [0, 1, 2]
  params:
    logreg: {C: 1.0}
    lgbm: {n_estimators: 400, learning_rate: 0.03, num_leaves: 31, min_child_samples: 50, subsample: 0.8,
           subsample_freq: 1, colsample_bytree: 0.8, reg_lambda: 1.0, n_jobs: 4}
gate:                      # promote the GBDT over the baseline only if both hold
  min_pr_auc_margin_std: 1.0   # PR-AUC margin > 1 x candidate seed std
  max_ece: 0.03
drift:
  seed: 0
  psi_alert: 0.25
  ks_alpha: 0.01
  share_alert: 0.2
  evidently: true
paths:
  model_dir: models
  report_dir: reports
mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment: credit-default
  registered_model: credit-default
